name: fail-report
description: Post captured step logs to the PR/commit when a job fails (ADR-0012)
inputs:
  job-status:
    description: Job status from the caller (${{ job.status }})
    required: true
runs:
  using: composite
  steps:
    - name: Upload captured logs
      if: always() && inputs.job-status == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: ci-logs-${{ github.job }}-${{ github.run_id }}
        path: log-*.txt
        if-no-files-found: ignore
        retention-days: 14
    - name: Post failure comment via API
      if: always() && inputs.job-status == 'failure'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        PR: ${{ github.event.number }}
        RUN_ID: ${{ github.run_id }}
        JOB: ${{ github.job }}
      run: |
        set -u
        if ! ls log-*.txt >/dev/null 2>&1; then
          echo "no captured logs (failure before tee?)" > log-empty.txt
        fi
        {
          echo "### ❌ CI job \`$JOB\` failed (run $RUN_ID)"
          echo ""
          echo "commit: \`${SHA:0:10}\`"
          for f in log-*.txt; do
            [ -f "$f" ] || continue
            echo ""
            echo "<details><summary><code>$f</code> (last 300 lines)</summary>"
            echo ""
            echo '```'
            tail -n 300 "$f" | sed -e 's/```/\`\`\`/g'
            echo '```'
            echo "</details>"
          done
        } > body.md
        head -c 55000 body.md > body-final.md
        python3 - <<'PY'
        import json
        body = open("body-final.md", encoding="utf-8", errors="replace").read()
        with open("payload.json", "w", encoding="utf-8") as f:
            json.dump({"body": body}, f)
        PY
        if [ -n "$PR" ]; then
          gh api "repos/$REPO/issues/$PR/comments" --input payload.json && echo "posted PR comment"
        else
          gh api "repos/$REPO/commits/$SHA/comments" --input payload.json && echo "posted commit comment"
        fi
